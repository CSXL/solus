version: 0.1
cli:
  version: 1.21.0
plugins:
  sources:
    - id: trunk
      ref: v1.2.2
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - pyright@1.1.357
    - ruff@0.3.5
    - taplo@0.8.1
    - checkov@3.2.55
    - gokart@0.5.1
    - osv-scanner@1.7.0
    - trivy@0.50.1
    - trufflehog@3.71.0
    - shellcheck@0.10.0
    - shfmt@3.6.0
    - actionlint@1.6.27
    - git-diff-check
    - gitleaks@8.18.2
    - gofmt@1.20.4
    - golangci-lint@1.57.2
    - markdownlint@0.39.0
    - oxipng@9.0.0
    - prettier@3.2.5
    - yamllint@1.35.1
runtimes:
  enabled:
    - go@1.21.0
    - node@18.12.1
    - python@3.10.8
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
